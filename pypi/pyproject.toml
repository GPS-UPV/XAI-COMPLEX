[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cejsp"
version = "0.5.0"
description = "CEJSP: JSP Complexity Estimator for job shop scheduling instances"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "MODEL_LICENSE", "NOTICE"]
authors = [{name = "Planning and Scheduling Research Group"}]
dependencies = ["numpy==2.4.6", "pandas>=2.1,<3", "scikit-learn==1.9.1", "scipy==1.17.1", "joblib==1.6.0", "ortools==9.15.6755"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
integration = ["IGJSP==2.0.1"]
graphs = ["torch>=2.2", "torch-geometric>=2.5", "networkx>=3", "tqdm>=4"]
research = ["ortools>=9.15,<10", "catboost>=1.2.10,<2"]
dev = ["pytest>=8", "build>=1.2", "twine>=6"]

[project.scripts]
cejsp = "cejsp.cli:main"
xai-complex = "xai_complex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
cejsp = ["data/reference.joblib", "data/reference.json"]
